# ============================================================================
# MySQL profile (utilisé via SPRING_PROFILES_ACTIVE=mysql)
# ============================================================================

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:mysql}:3306/projectdb?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER:pmtuser}
spring.datasource.password=${MYSQL_PASSWORD:pmtpass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.h2.console.enabled=false
